# Copy to .github/workflows/ac-check.yml. Needs LINEAR_API_KEY plus CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
name: AC check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  ac-check:
    uses: aowen14/review-kit/.github/workflows/ac-check.yml@82bab20f4ccf7791b19d60b5c5868ef32ca0b796  # review-kit ENG2-1656 branch; switch to @v1 after release
    secrets: inherit
